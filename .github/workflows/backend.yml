name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**']
  pull_request:
    branches: [main]
    paths: ['backend/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: cd backend && mvn clean verify -q

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: connectly-backend-jar
          path: backend/target/connectly-backend-*.jar
          retention-days: 7
