# Local development profile – uses H2 file-based database (no PostgreSQL needed)
# Start with: java -jar target/connectly-backend-1.0.0.jar --spring.profiles.active=local
spring:
  datasource:
    url: jdbc:h2:file:./connectly_local_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none        # Flyway handles DDL
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true          # Browse DB at http://localhost:8080/h2-console

# Allow H2 console through security (open in SecurityConfig for /h2-console when local)
connectly:
  local-dev: true
