server:
  port: ${PORT:8080}

spring:
  application:
    name: connectly-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/connectly}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

connectly:
  jwt:
    secret: ${JWT_SECRET:connectly-ultra-secure-256-bit-secret-key-for-jwt-token-generation-2024!}
    expiration-ms: 86400000
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://connectly.pages.dev}
