version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: connectly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: connectly
      POSTGRES_USER: connectly_user
      POSTGRES_PASSWORD: connectly_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectly_user -d connectly"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: connectly_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/connectly
      DATABASE_USERNAME: connectly_user
      DATABASE_PASSWORD: connectly_pass
      JWT_SECRET: "connectly-docker-dev-secret-change-in-production!"
      JWT_EXPIRATION_MS: "86400000"
      CORS_ALLOWED_ORIGINS: "http://localhost:4200"
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  # ── Angular Frontend (served via nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: connectly_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      API_URL: http://backend:8080

volumes:
  postgres_data:
  backend_uploads:
